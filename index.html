<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World App</title>
  <link href="styles.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Hello World! 👋</h1>
      <p class="welcome-text">Selamat datang di aplikasi Hello World sederhana</p>

      <div class="button-group">
        <button id="btn-greet" class="btn btn-primary">Klik Saya</button>
        <button id="btn-clear" class="btn btn-secondary">Reset</button>
      </div>

      <div id="message" class="message"></div>

      <div class="info">
        <p>Ini adalah test aplikasi HTML sederhana yang bisa dibuka di browser</p>
        <small>Dibuat dengan ❤️ menggunakan HTML, CSS, dan JavaScript</small>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
